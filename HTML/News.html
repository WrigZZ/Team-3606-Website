<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/JS/SiteLock.js"></script>
  <title>News</title>
  <link rel="stylesheet" href="/CSS/News.css">
  <link rel="icon" type="image/png" href="/Gallery/Other/Favicon.png">
  <meta property="og:title" content="News - Owen's Website">
  <meta property="og:description" content="Latest news from Owen's Website.">
  <meta property="og:url" content="https://owenspeer.com/News.html">
  <meta property="og:type" content="website">
</head>

<body>

  <nav class="topbar">
    <div class="logo">
      <a href="/HTML/Home.html">
        <img src="/Gallery/Other/FaviconLogo.png" alt="Logo" class="screenshot" id="screenshot">
      </a>
    </div>
    <div class="midtext">
      <p class="title">Owen's Website</p>
    </div>
    <div class="menudiv">
      <button class="menu" id="menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="dropdown" id="dropdown">
        <a href="/HTML/Home.html" class="droplink">Home</a>
        <a href="/HTML/News.html" class="droplink active">News</a>
        <a href="/HTML/Calendar.html" class="droplink">Calendar</a>
        <a href="/HTML/Assignments.html" class="droplink">Assignments</a>
        <div class="droplink historymenu" id="history-btn">
          History <span class="arrow">&#129030;</span>
          <div class="subdropdown" id="subdropdown">
            <a href="/YearsHTML/Sophomore.html" class="sublink">Sophomore</a>
            <a href="/YearsHTML/Freshman.html" class="sublink">Freshman</a>
            <a href="/YearsHTML/8th Grade.html" class="sublink">8th Grade</a>
          </div>
        </div>
        <div class="theme-row" id="theme-row">
          <span class="theme-label">
            <span id="theme-icon"></span>
            <span id="theme-text">Light Mode</span>
          </span>
          <label class="toggle-switch" title="Toggle dark mode">
            <input type="checkbox" id="theme-toggle">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
  </nav>

  <div class="content">
    <p class="pagetitle">News</p>

    <div class="search-wrap" id="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="search-input" id="search-input" placeholder="Search articles...">
      <button class="search-clear" id="search-clear">&#10005;</button>
    </div>

    <div class="news-container" id="news-container">
      <p class="loading-msg" id="loading-msg">Loading articles...</p>
    </div>

    <button class="edit-btn" id="edit-btn">&#9998; Edit</button>
  </div>


  <!-- ADMIN MODAL -->
  <div class="overlay" id="admin-overlay">
    <div class="modal-box admin-box">
      <p class="modal-title">Edit News</p>

      <div class="admin-section">
        <p class="section-label">Add Article</p>
        <input type="text" class="admin-input" id="article-title" placeholder="Title">
        <input type="url"  class="admin-input" id="article-image" placeholder="Image URL (optional)">
        <textarea class="admin-input admin-textarea" id="article-desc" placeholder="Article content"></textarea>
        <button class="modal-btn confirm-btn" id="add-article-btn">Post Article</button>
      </div>

      <div class="admin-section">
        <p class="section-label">Existing Articles</p>
        <div id="admin-articles-list"></div>
      </div>

      <button class="modal-btn cancel-btn" id="close-admin">Close</button>
    </div>
  </div>


  <div class="footer">
    <div class="topbit">
      <a href="https://owenspeer.com" target="_blank">
        <img src="/Gallery/Other/3606Logo.png" alt="Blue Alliance" class="footerlink">
      </a>
      <a href="https://www.catholichigh.org/" target="_blank">
        <img src="/Gallery/Other/CatholicLogo.jpg" alt="CHS" class="footerlink">
      </a>
      <a href="https://github.com/WrigZZ/Team-3606-Website" target="_blank">
        <img src="/Gallery/Other/GithubLogo.png" alt="Web Code" class="footerlink">
      </a>
    </div>
    <div class="bottombit">
    </div>
    <div class="copyright">
      <p>&copy; 2026 Owen Speer</p>
    </div>
  </div>


  <script type="module" src="/JS/News.js"></script>

  <script src="/JS/Menu.js"></script>

</body>

</html>
