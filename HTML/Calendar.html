<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/JS/SiteLock.js"></script>
  <title>Calendar</title>
  <link rel="stylesheet" href="/CSS/Calendar.css">
  <link rel="icon" type="image/png" href="/Gallery/Other/Favicon.png">
  <meta property="og:title" content="Calendar - Owen's Website">
  <meta property="og:description" content="Upcoming events and competitions for my Website.">
  <meta property="og:url" content="https://owenspeer.com/Calendar.html">
  <meta property="og:type" content="website">
</head>

<body>

  <nav class="topbar">
    <div class="logo">
      <a href="/HTML/Home.html">
        <img src="/Gallery/Other/FaviconLogo.png" alt="Logo" class="screenshot" id="screenshot">
      </a>
    </div>
    <div class="midtext">
      <p class="title">Owen's Website</p>
    </div>
    <div class="menudiv">
      <button class="menu" id="menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="dropdown" id="dropdown">
        <a href="/HTML/Home.html" class="droplink">Home</a>
        <a href="/HTML/News.html" class="droplink">News</a>
        <a href="/HTML/Calendar.html" class="droplink active">Calendar</a>
        <a href="/HTML/Assignments.html" class="droplink">Assignments</a>
        <div class="droplink historymenu" id="history-btn">
          History <span class="arrow">&#129030;</span>
          <div class="subdropdown" id="subdropdown">
            <a href="/YearsHTML/Sophomore.html" class="sublink">Sophomore</a>
            <a href="/YearsHTML/Freshman.html" class="sublink">Freshman</a>
            <a href="/YearsHTML/8th Grade.html" class="sublink">8th Grade</a>
          </div>
        </div>
        <div class="theme-row" id="theme-row">
          <span class="theme-label">
            <span id="theme-icon"></span>
            <span id="theme-text">Light Mode</span>
          </span>
          <label class="toggle-switch" title="Toggle dark mode">
            <input type="checkbox" id="theme-toggle">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
  </nav>

  <div class="content">
    <p class="pagetitle">Calendar</p>

    <div class="cal-nav">
      <button class="month-btn" id="prev-month">&#8592;</button>
      <p class="month-label" id="month-label"></p>
      <button class="month-btn" id="next-month">&#8594;</button>
    </div>

    <div class="cal-grid" id="cal-grid">
      <div class="day-header">Sun</div>
      <div class="day-header">Mon</div>
      <div class="day-header">Tue</div>
      <div class="day-header">Wed</div>
      <div class="day-header">Thu</div>
      <div class="day-header">Fri</div>
      <div class="day-header">Sat</div>
    </div>

    <button class="edit-btn" id="edit-btn">&#9998; Edit</button>
  </div>


  <!-- ADMIN MODAL -->
  <div class="overlay" id="admin-overlay">
    <div class="modal-box admin-box">
      <p class="modal-title">Edit Calendar</p>
      <div class="admin-section">
        <p class="section-label">Add Event</p>
        <input type="text" class="admin-input" id="event-name" placeholder="Event name">
        <input type="date" class="admin-input" id="event-date">

        <label for="event-time" style="display:block; font-size:12px; color:rgb(150,150,150); margin:10px 0 4px;">Start time (optional &mdash; leave blank for an all-day event)</label>
        <input type="time" class="admin-input" id="event-time">

        <label for="event-end-time" style="display:block; font-size:12px; color:rgb(150,150,150); margin:10px 0 4px;">End time (optional)</label>
        <input type="time" class="admin-input" id="event-end-time">

        <textarea class="admin-input admin-textarea" id="event-desc" placeholder="Description (optional)"></textarea>
        <button class="modal-btn confirm-btn" id="add-event-btn">Add Event</button>
      </div>
      <div class="admin-section">
        <p class="section-label">Existing Events</p>
        <div id="admin-events-list"></div>
      </div>
      <button class="modal-btn cancel-btn" id="close-admin">Close</button>
    </div>
  </div>


  <div class="footer">
    <div class="topbit">
      <a href="https://owenspeer.com" target="_blank">
        <img src="/Gallery/Other/3606Logo.png" alt="Blue Alliance" class="footerlink">
      </a>
      <a href="https://www.catholichigh.org/" target="_blank">
        <img src="/Gallery/Other/CatholicLogo.jpg" alt="CHS" class="footerlink">
      </a>
      <a href="https://github.com/WrigZZ/Team-3606-Website" target="_blank">
        <img src="/Gallery/Other/GithubLogo.png" alt="Web Code" class="footerlink">
      </a>
    </div>
    <div class="bottombit">
    </div>
    <div class="copyright">
      <p>&copy; 2026 Owen Speer</p>
    </div>
  </div>


  <script type="module" src="/JS/Calendar.js"></script>

  <script src="/JS/Menu.js"></script>

</body>

</html>
