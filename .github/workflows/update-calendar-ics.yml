# Place this file at: .github/workflows/update-calendar-ics.yml
#
# Regenerates calendar.ics from Firestore on a schedule and commits it.
# Cloudflare Pages (connected to this repo) then redeploys automatically —
# Cloudflare itself never runs any code here, it only ever serves the
# resulting calendar.ics as a static file.

name: Refresh calendar.ics

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours — adjust as you like
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase SDK
        run: npm install firebase

      - name: Generate calendar.ics
        run: node tools/generate-ics.mjs

      - name: Commit calendar.ics if it changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || git commit -m "Refresh calendar.ics"
          git push
